<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Chatter — Realtime Chat</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <!-- Welcome / auth screen -->
  <section id="welcome" class="screen active">
    <form id="join-form" class="card" autocomplete="off">
      <div class="brand-mark" aria-hidden="true">
        <svg viewBox="0 0 24 24" width="30" height="30" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/>
        </svg>
      </div>
      <h1>Chatter</h1>
      <p class="sub">Realtime chat with accounts. Log in, sign up, or drop in as a guest.</p>

      <div class="tabs" id="tabs">
        <button type="button" class="tab active" data-mode="login">Log in</button>
        <button type="button" class="tab" data-mode="register">Sign up</button>
        <button type="button" class="tab" data-mode="guest">Guest</button>
      </div>

      <label for="name-input" id="name-label">Username</label>
      <input id="name-input" type="text" maxlength="20" placeholder="e.g. alex" required />

      <div id="pass-block">
        <label for="pass-input">Password</label>
        <input id="pass-input" type="password" maxlength="100" placeholder="••••••••" />
      </div>

      <div id="confirm-block" hidden>
        <label for="pass2-input">Confirm password</label>
        <input id="pass2-input" type="password" maxlength="100" placeholder="••••••••" />
      </div>

      <label for="room-input">Room</label>
      <div id="room-chips" class="room-chips"></div>
      <input id="room-input" type="text" maxlength="24" placeholder="or type a new room name" />

      <button type="submit" class="btn-primary" id="auth-btn">Log in &amp; join</button>
      <p id="join-error" class="error" role="alert"></p>
    </form>
  </section>

  <!-- Chat screen -->
  <section id="chat" class="screen">
    <div id="sidebar-backdrop" class="sidebar-backdrop" hidden></div>
    <aside id="sidebar" class="sidebar">
      <div class="side-brand">
        <span class="dot"></span> Chatter
      </div>

      <div class="side-section">
        <div class="side-title">
          Rooms
          <button id="add-room" class="icon-btn" title="New room" type="button">+</button>
        </div>
        <ul id="room-list" class="room-list"></ul>
      </div>

      <div class="side-section">
        <div class="side-title">
          Direct messages
          <button id="add-dm" class="icon-btn" title="New message" type="button">+</button>
        </div>
        <ul id="dm-list" class="room-list dm-list"></ul>
      </div>

      <div class="side-section online">
        <div class="side-title">Online — <span id="online-count">0</span></div>
        <ul id="member-list" class="member-list"></ul>
      </div>

      <div class="side-me">
        <span id="me-avatar" class="avatar"></span>
        <span id="me-name"></span>
        <button id="leave" class="link-btn" type="button">Log out</button>
      </div>
    </aside>

    <main class="main">
      <header class="chat-header">
        <button id="menu-btn" class="icon-btn menu-btn" type="button" title="Menu" aria-label="Menu">&#9776;</button>
        <div>
          <h2 id="room-title"># General</h2>
          <span id="room-sub" class="subtle">0 online</span>
        </div>
      </header>

      <div id="messages" class="messages"></div>

      <div id="typing" class="typing"></div>

      <form id="composer" class="composer" autocomplete="off">
        <input type="file" id="file-input" hidden />
        <button type="button" id="attach-btn" class="attach-btn" title="Attach file" aria-label="Attach file">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21.44 11.05l-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48"/>
          </svg>
        </button>
        <textarea id="msg-input" rows="1" maxlength="500" placeholder="Message #General"></textarea>
        <button type="submit" class="send-btn" title="Send">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/>
          </svg>
        </button>
      </form>
    </main>
  </section>

  <script src="transport.js"></script>
  <script src="app.js"></script>
</body>
</html>
